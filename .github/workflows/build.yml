name: Build API 102 module

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Sign APK
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          echo "Android SDK: $ANDROID_HOME"
          echo "Build Tools: $BUILD_TOOLS"

          echo "Checking tools:"
          "$BUILD_TOOLS/zipalign" -h >/dev/null
          "$BUILD_TOOLS/apksigner" version

          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias autostart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AutoStartFCM,O=AutoStartFCM,C=VN"

          UNSIGNED_APK=$(find app/build/outputs -type f -name "*unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "ERROR: Unsigned APK not found"
            exit 1
          fi

          echo "Unsigned APK: $UNSIGNED_APK"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias autostart \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release.apk \
            app-release-aligned.apk

          echo "Verifying signed APK..."

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            app-release.apk

          echo "Signed APK created successfully:"
          ls -lh app-release.apk

     
